[project]
name = "image-prompt-expander"
version = "0.1.0"
description = "Procedural image prompt generator with optional local image generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0.0",
  "fastapi>=0.109.0",
  "filelock>=3.0.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
  "requests>=2.33.1",
  "sse-starlette>=1.8.0",
  "tracery>=0.1.1",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
images = [
  "mflux==0.24.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.uv]
package = false
